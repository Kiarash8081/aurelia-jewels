<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لومیر | جواهرات</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #1a1a1a; font-family: Tahoma, "Segoe UI", sans-serif; }
    button, input, select { font-family: inherit; }
    .top { background: #111; color: #fff; text-align: center; font-size: 12px; letter-spacing: .14em; padding: 8px; }
    header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 18px 28px; border-bottom: 1px solid #eee; }
    .logo { font-size: 28px; letter-spacing: .12em; text-align: center; }
    nav, .tools { display: flex; gap: 16px; }
    .tools { justify-content: flex-end; }
    nav button, .tools button { background: none; border: 0; cursor: pointer; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    .cats { display: flex; justify-content: center; gap: 28px; padding: 14px; border-bottom: 1px solid #eee; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
    .hero { height: 420px; background: #f6f3ef center/cover no-repeat; display: grid; place-items: center; text-align: center; }
    .hero h1 { font-weight: 400; font-size: 42px; margin: 0; background: rgba(255,255,255,.86); padding: 18px 28px; }
    .wrap { width: min(1180px, calc(100% - 32px)); margin: 28px auto 60px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .card { text-align: center; }
    .card img { width: 100%; height: 260px; object-fit: cover; background: #f3f3f3; }
    .card h3 { font-size: 15px; font-weight: 600; margin: 10px 0 4px; }
    .was { color: #999; text-decoration: line-through; margin-right: 6px; }
    .now { color: #9a1b1b; font-weight: 700; }
    select, input { width: 100%; margin: 8px 0; padding: 8px; border: 1px solid #ddd; }
    .buy { width: 100%; background: #111; color: #fff; border: 0; padding: 10px; cursor: pointer; letter-spacing: .08em; }
    .sheet { max-width: 720px; margin: 40px auto; }
    .row { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 12px 0; }
    footer { border-top: 1px solid #eee; padding: 28px; text-align: center; color: #777; font-size: 13px; }
    #intro { position: fixed; inset: 0; z-index: 20; background: #fff; display: grid; place-items: center; transition: opacity .6s ease; }
    #intro.hide { opacity: 0; pointer-events: none; }
    #intro img { width: 92px; height: 92px; object-fit: cover; border-radius: 50%; animation: rise 1.1s ease; }
    #intro b { display: block; margin-top: 14px; letter-spacing: .28em; font-weight: 400; }
    @keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } header { grid-template-columns: 1fr; gap: 10px; } .cats { display: none; } }
  </style>
</head>
<body>
  <div id="intro"><div><img src="img/lumiere-logo.jpg" alt=""><b>LUMIÈRE</b></div></div>
  <div class="top">بسته‌بندی هدیه برای هر سفارش</div>
  <header>
    <nav>
      <button data-go="shop">فروشگاه</button>
      <button data-go="orders">سفارش‌ها</button>
      <button data-go="terms">قوانین</button>
    </nav>
    <div class="logo">لومیر</div>
    <div class="tools">
      <button id="loginBtn">حساب</button>
      <button id="cartBtn">سبد (<span id="count">0</span>)</button>
    </div>
  </header>
  <div class="cats"><span>انگشتر</span><span>گردنبند</span><span>گوشواره</span><span>دستبند</span></div>
  <main id="app"></main>
  <footer>آتلیه لومیر · قیمت‌ها نمونه هستند</footer>
  <script>
    const products = [
      ["r1","انگشتر طلای ساده","img/jewel-ring.jpg",28500000,24800000],
      ["r2","گردنبند مروارید","img/jewel-pearl.jpg",18900000,16400000],
      ["r3","گوشواره آویز","img/jewel-earrings.jpg",6400000,6400000],
      ["r4","دستبند زنجیر","img/jewel-bracelet.jpg",9200000,7900000],
      ["r5","انگشتر تک‌نگین","img/jewel-ring.jpg",42000000,38900000],
      ["r6","گوشواره میخی","img/jewel-earrings.jpg",4100000,4100000],
      ["r7","آویز بیضی","img/jewel-pearl.jpg",8700000,7600000],
      ["r8","گردنبند زنجیر","img/jewel-bracelet.jpg",5600000,5600000]
    ].map(([id,name,img,was,now]) => ({id,name,img,was,now}));
    const key="lumiere-v3";
    const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(key+k))??d}catch{return d}};
    const write=(k,v)=>localStorage.setItem(key+k,JSON.stringify(v));
    let cart=read("c",[]), user=read("u",null), orders=read("o",[]), view="home";
    const gbp=n=>new Intl.NumberFormat("fa-IR").format(n)+" تومان";
    setTimeout(()=>document.getElementById("intro").classList.add("hide"), 1700);
    const find=id=>products.find(p=>p.id===id);
    const app=document.getElementById("app");
    const go=v=>{view=v;draw()};
    document.getElementById("cartBtn").onclick=()=>go("cart");
    document.getElementById("loginBtn").onclick=()=>go(user?"account":"login");
    function card(p){return `<article class="card"><img src="${p.img}" alt="${p.name}"><h3>${p.name}</h3><p>${p.was!==p.now?`<span class="was">${gbp(p.was)}</span>`:""}<span class="now">${gbp(p.now)}</span></p><select id="s-${p.id}"><option>کوچک</option><option selected>متوسط</option><option>بزرگ</option></select><button class="buy" data-add="${p.id}">افزودن به سبد</button></article>`}
    function draw(){
      document.getElementById("count").textContent=cart.reduce((s,i)=>s+i.qty,0);
      document.getElementById("loginBtn").textContent=user?user.name:"حساب";
      const pages={home,shop,cart:cartView,checkout,orders:ordersView,terms,login,account};
      app.innerHTML=pages[view]();
      document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
      document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
        const size=document.getElementById("s-"+b.dataset.add).value;
        const hit=cart.find(x=>x.id===b.dataset.add&&x.size===size);
        if(hit)hit.qty++; else cart.push({id:b.dataset.add,size,qty:1});
        write("c",cart); draw();
      });
      document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.del,1);write("c",cart);draw()});
      const pay=document.getElementById("pay");
      if(pay)pay.onclick=()=>{orders.unshift({items:cart.map(i=>({name:find(i.id).name,size:i.size})),total:cart.reduce((s,i)=>s+find(i.id).now*i.qty,0)});write("o",orders);cart=[];write("c",cart);go("orders")};
      const enter=document.getElementById("enter");
      if(enter)enter.onclick=()=>{const name=document.getElementById("nm").value.trim(); if(!name)return; user={name}; write("u",user); go("shop")};
      const out=document.getElementById("out");
      if(out)out.onclick=()=>{user=null;write("u",null);go("home")};
    }
    function home(){return `<section class="hero" style="background-image:url('img/jewel-pearl.jpg')"><h1>مجموعه خصوصی</h1></section><div class="wrap"><div class="grid">${products.map(card).join("")}</div></div>`}
    function shop(){return `<div class="wrap"><div class="grid">${products.map(card).join("")}</div></div>`}
    function cartView(){if(!cart.length)return `<div class="sheet"><h2>سبد خالی است</h2><button class="buy" data-go="shop">ادامه خرید</button></div>`;const total=cart.reduce((s,i)=>s+find(i.id).now*i.qty,0);return `<div class="sheet"><h2>سبد</h2>${cart.map((i,idx)=>`<div class="row"><div>${find(i.id).name}<br>${i.size} × ${i.qty}</div><div>${gbp(find(i.id).now*i.qty)}<br><button data-del="${idx}">حذف</button></div></div>`).join("")}<p><b>${gbp(total)}</b></p><button class="buy" data-go="checkout">پرداخت</button></div>`}
    function checkout(){if(!user)return `<div class="sheet"><h2>برای خرید وارد شوید</h2><button class="buy" data-go="login">حساب</button></div>`;return `<div class="sheet"><h2>پرداخت آزمایشی</h2><p>${user.name}</p><input value="6037 0000 0000 4410"><p>پرداخت واقعی انجام نمی‌شود.</p><button class="buy" id="pay">ثبت سفارش</button></div>`}
    function ordersView(){if(!orders.length)return `<div class="sheet"><h2>سفارشی نیست</h2></div>`;return `<div class="sheet"><h2>سفارش‌ها</h2>${orders.map(o=>`<div class="row"><span>${o.items.map(i=>i.name).join("، ")}</span><span>${gbp(o.total)}</span></div>`).join("")}</div>`}
    function terms(){return `<div class="sheet"><h2>قوانین</h2><p>قیمت‌ها نمونه هستند و سفارش فقط در همین مرورگر می‌ماند.</p></div>`}
    function login(){return `<div class="sheet"><h2>حساب</h2><input id="nm" placeholder="نام"><button class="buy" id="enter">ادامه</button></div>`}
    function account(){return `<div class="sheet"><h2>${user.name}</h2><button class="buy" id="out">خروج</button></div>`}
    document.querySelectorAll("header [data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
    draw();
  </script>
</body>
</html>
