<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>آورلیا | جواهرات</title>
  <meta name="description" content="مجموعه جواهرات آورلیا با قیمت نمونه، سبد خرید و پرداخت آزمایشی." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;500&display=swap" rel="stylesheet" />
  <style>
    :root { --gold: #e0c48a; --ink: #f6f1e7; --dim: #b7ab9a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #090909; color: var(--ink); font-family: Jost, sans-serif; }
    button, input, select { font-family: inherit; color: inherit; }
    header {
      position: fixed; inset: 0 0 auto 0; z-index: 5; height: 74px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 4vw; background: linear-gradient(#090909, transparent);
    }
    .logo { font-family: "Cormorant Garamond", serif; letter-spacing: 0.42em; font-size: 1.35rem; text-decoration: none; color: var(--gold); }
    nav, .tools { display: flex; gap: 18px; }
    nav button, .tools button { background: none; border: 0; cursor: pointer; letter-spacing: 0.14em; font-size: 0.72rem; color: var(--dim); }
    .cover { min-height: 100vh; display: grid; place-items: end stretch; position: relative; }
    .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.45); }
    .cover-copy { position: relative; padding: 18vh 8vw 10vh; }
    .eyebrow { color: var(--gold); letter-spacing: 0.28em; font-size: 0.72rem; }
    h1, h2 { font-family: "Cormorant Garamond", serif; font-weight: 500; }
    h1 { font-size: clamp(3rem, 7vw, 6.4rem); line-height: 0.95; margin: 12px 0; max-width: 12ch; }
    .lede { max-width: 36rem; color: #ddd4c6; line-height: 1.9; }
    .gold {
      margin-top: 22px; background: transparent; color: var(--gold);
      border: 1px solid var(--gold); padding: 12px 22px; letter-spacing: 0.16em; cursor: pointer;
    }
    .strip { display: grid; grid-template-columns: repeat(3, minmax(240px, 1fr)); gap: 22px; padding: 8vh 4vw 12vh; }
    .piece { background: #111; }
    .piece img { width: 100%; height: 360px; object-fit: cover; display: block; }
    .piece div { padding: 16px 8px 22px; }
    .piece h3 { margin: 0 0 6px; font-family: "Cormorant Garamond", serif; font-size: 1.7rem; font-weight: 500; }
    .meta { color: var(--dim); line-height: 1.7; }
    .price { color: var(--gold); }
    select, input { width: 100%; margin: 8px 0 12px; background: #161616; border: 1px solid #333; padding: 10px; }
    .sheet { max-width: 680px; margin: 18vh auto 10vh; padding: 0 22px; }
    .line { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid #2a2a2a; padding: 16px 0; }
    footer { padding: 28px 4vw 40px; color: #766b5d; letter-spacing: 0.18em; font-size: 0.72rem; }
    @media (max-width: 800px) {
      nav { display: none; }
      .strip { grid-template-columns: 1fr; }
      h1 { font-size: 3.2rem; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="#home">AURELIA</a>
    <nav>
      <button data-go="home">خانه</button>
      <button data-go="shop">مجموعه</button>
      <button data-go="orders">سفارش‌ها</button>
      <button data-go="contact">تماس</button>
      <button data-go="terms">قوانین</button>
    </nav>
    <div class="tools">
      <button id="loginBtn">ورود</button>
      <button id="cartBtn">سبد <span id="count">0</span></button>
    </div>
  </header>
  <main id="app"></main>
  <footer>AURELIA · قیمت‌ها نمونه هستند</footer>
  <script>
    const products = [
      ["ring-line","انگشتر خط طلا","حلقه نازک با سطح مات.",4200000,"https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=1200&q=80"],
      ["pearl","گردنبند مروارید","یک رج مروارید با قفل طلا.",6800000,"https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=1200&q=80"],
      ["drop","گوشواره آویز","آویز کوتاه برای هر روز.",3100000,"https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=1200&q=80"],
      ["chain","دستبند زنجیر","زنجیر ظریف با قفل مخفی.",5400000,"https://images.unsplash.com/photo-1611652022419-a9419f74343d?auto=format&fit=crop&w=1200&q=80"],
      ["stone","انگشتر نگین","نگین شفاف روی پایه کوتاه.",8900000,"https://images.unsplash.com/photo-1603561591411-07134e71a2a9?auto=format&fit=crop&w=1200&q=80"],
      ["stud","گوشواره میخی","دو نقطه نور روی گوش.",1900000,"https://images.unsplash.com/photo-1617038260897-41a1f14a8ca0?auto=format&fit=crop&w=1200&q=80"]
    ].map(([id,name,text,price,img]) => ({id,name,text,price,img}));
    const key = "aurelia-v2";
    const read = (k,d) => { try { return JSON.parse(localStorage.getItem(key+k)) ?? d; } catch { return d; } };
    const write = (k,v) => localStorage.setItem(key+k, JSON.stringify(v));
    let cart = read("cart", []), user = read("user", null), orders = read("orders", []), view = "home";
    const money = (n) => new Intl.NumberFormat("fa-IR").format(n) + " تومان";
    const find = (id) => products.find((p) => p.id === id);
    const app = document.getElementById("app");
    const go = (v) => { view = v; draw(); };
    document.getElementById("cartBtn").onclick = () => go("cart");
    document.getElementById("loginBtn").onclick = () => go(user ? "account" : "login");
    function draw() {
      document.getElementById("count").textContent = cart.reduce((s,i)=>s+i.qty,0);
      document.getElementById("loginBtn").textContent = user ? user.name : "ورود";
      const pages = { home, shop, cart: cartView, checkout, orders: ordersView, contact, terms, login, account };
      app.innerHTML = pages[view]();
      document.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => go(b.dataset.go));
      document.querySelectorAll("[data-add]").forEach((b) => b.onclick = () => {
        const size = document.getElementById("s-"+b.dataset.add).value;
        const hit = cart.find((x) => x.id === b.dataset.add && x.size === size);
        if (hit) hit.qty++; else cart.push({ id: b.dataset.add, size, qty: 1 });
        write("cart", cart); draw();
      });
      document.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => { cart.splice(+b.dataset.del,1); write("cart", cart); draw(); });
      const pay = document.getElementById("pay");
      if (pay) pay.onclick = () => {
        orders.unshift({ items: cart.map((i) => ({ name: find(i.id).name, size: i.size, qty: i.qty })), total: cart.reduce((s,i)=>s+find(i.id).price*i.qty,0) });
        write("orders", orders); cart = []; write("cart", cart); go("orders");
      };
      const enter = document.getElementById("enter");
      if (enter) enter.onclick = () => {
        const name = document.getElementById("nm").value.trim();
        const phone = document.getElementById("ph").value.trim();
        if (!name || !phone) return;
        user = { name, phone }; write("user", user); go("shop");
      };
      const out = document.getElementById("out");
      if (out) out.onclick = () => { user = null; write("user", null); go("home"); };
    }
    const cards = () => products.map((p) => `<article class="piece"><img src="${p.img}" alt="${p.name}"><div><h3>${p.name}</h3><p class="meta">${p.text}</p><p class="price">${money(p.price)}</p><select id="s-${p.id}"><option>کوچک</option><option selected>متوسط</option><option>بزرگ</option></select><button class="gold" data-add="${p.id}">افزودن</button></div></article>`).join("");
    function home(){return `<section class="cover"><img src="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=1800&q=80" alt=""><div class="cover-copy"><p class="eyebrow">JOAILLERIE</p><h1>نور ملایم روی طلا</h1><p class="lede">شش قطعه از مجموعه خصوصی آورلیا. اندازه را انتخاب کنید و سفارش را تا پرداخت آزمایشی ادامه دهید.</p><button class="gold" data-go="shop">مشاهده مجموعه</button></div></section><section class="strip">${cards()}</section>`}
    function shop(){return `<section class="strip" style="padding-top:18vh">${cards()}</section>`}
    function cartView(){ if(!cart.length) return `<section class="sheet"><h2>سبد خالی است</h2><button class="gold" data-go="shop">بازگشت</button></section>`; const total = cart.reduce((s,i)=>s+find(i.id).price*i.qty,0); return `<section class="sheet"><h2>سبد</h2>${cart.map((i,idx)=>`<div class="line"><div>${find(i.id).name}<div class="meta">${i.size} · ${i.qty}</div></div><div>${money(find(i.id).price*i.qty)}<br><button data-del="${idx}">حذف</button></div></div>`).join("")}<p class="price">جمع ${money(total)}</p><button class="gold" data-go="checkout">پرداخت</button></section>`}
    function checkout(){ if(!user) return `<section class="sheet"><h2>برای سفارش وارد شوید</h2><button class="gold" data-go="login">ورود</button></section>`; return `<section class="sheet"><h2>پرداخت آزمایشی</h2><p class="meta">${user.name}</p><input value="6037 0000 0000 4410"><p class="meta">این پرداخت به بانک وصل نیست.</p><button class="gold" id="pay">ثبت سفارش</button></section>`}
    function ordersView(){ if(!orders.length) return `<section class="sheet"><h2>سفارشی ثبت نشده</h2></section>`; return `<section class="sheet"><h2>سفارش‌ها</h2>${orders.map((o)=>`<div class="line"><div>${o.items.map(i=>i.name).join("، ")}</div><div>${money(o.total)}</div></div>`).join("")}</section>`}
    function contact(){ return `<section class="sheet"><h2>تماس</h2><p class="lede">تلفن ۰۲۱۹۱۰۰۴۴۱۰</p><p class="meta">هر روز از ۱۲ تا ۲۱ پاسخ می‌دهیم.</p></section>`}
    function terms(){ return `<section class="sheet"><h2>قوانین</h2><p class="lede">قیمت‌ها نمایشی هستند. سفارش فقط در همین مرورگر ذخیره می‌شود.</p></section>`}
    function login(){ return `<section class="sheet"><h2>ورود</h2><input id="nm" placeholder="نام"><input id="ph" placeholder="موبایل"><button class="gold" id="enter">ادامه</button></section>`}
    function account(){ return `<section class="sheet"><h2>${user.name}</h2><p class="meta">${user.phone}</p><button class="gold" id="out">خروج</button></section>`}
    document.querySelectorAll("header [data-go]").forEach((b)=>b.onclick=()=>go(b.dataset.go));
    draw();
  </script>
</body>
</html>
