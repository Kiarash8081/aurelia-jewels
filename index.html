<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumière Atelier | Fine jewellery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@0;1&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #1a1a1a; font-family: "Nunito Sans", sans-serif; }
    button, input, select { font-family: inherit; }
    .top { background: #111; color: #fff; text-align: center; font-size: 12px; letter-spacing: .14em; padding: 8px; }
    header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 18px 28px; border-bottom: 1px solid #eee; }
    .logo { font-family: "Libre Baskerville", serif; font-size: 28px; letter-spacing: .18em; text-align: center; }
    nav, .tools { display: flex; gap: 16px; }
    .tools { justify-content: flex-end; }
    nav button, .tools button { background: none; border: 0; cursor: pointer; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    .cats { display: flex; justify-content: center; gap: 28px; padding: 14px; border-bottom: 1px solid #eee; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
    .hero { height: 420px; background: #f6f3ef center/cover no-repeat; display: grid; place-items: center; text-align: center; }
    .hero h1 { font-family: "Libre Baskerville", serif; font-weight: 400; font-size: 54px; margin: 0; background: rgba(255,255,255,.86); padding: 18px 28px; }
    .wrap { width: min(1180px, calc(100% - 32px)); margin: 28px auto 60px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .card { text-align: center; }
    .card img { width: 100%; height: 260px; object-fit: cover; background: #f3f3f3; }
    .card h3 { font-size: 15px; font-weight: 600; margin: 10px 0 4px; }
    .was { color: #999; text-decoration: line-through; margin-right: 6px; }
    .now { color: #9a1b1b; font-weight: 700; }
    select, input { width: 100%; margin: 8px 0; padding: 8px; border: 1px solid #ddd; }
    .buy { width: 100%; background: #111; color: #fff; border: 0; padding: 10px; cursor: pointer; letter-spacing: .08em; }
    .sheet { max-width: 720px; margin: 40px auto; }
    .row { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 12px 0; }
    footer { border-top: 1px solid #eee; padding: 28px; text-align: center; color: #777; font-size: 13px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } header { grid-template-columns: 1fr; gap: 10px; } .cats { display: none; } }
  </style>
</head>
<body>
  <div class="top">Complimentary gift wrap on every order</div>
  <header>
    <nav>
      <button data-go="shop">Shop</button>
      <button data-go="orders">Orders</button>
      <button data-go="terms">Terms</button>
    </nav>
    <div class="logo">LUMIÈRE</div>
    <div class="tools">
      <button id="loginBtn">Account</button>
      <button id="cartBtn">Bag (<span id="count">0</span>)</button>
    </div>
  </header>
  <div class="cats"><span>Rings</span><span>Necklaces</span><span>Earrings</span><span>Bracelets</span></div>
  <main id="app"></main>
  <footer>Lumière Atelier · Sample prices for a portfolio piece</footer>
  <script>
    const products = [
      ["r1","Fine gold band","https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=800&q=80",890,690],
      ["r2","Pearl strand","https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=800&q=80",1240,980],
      ["r3","Drop earrings","https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=800&q=80",420,420],
      ["r4","Trace bracelet","https://images.unsplash.com/photo-1611652022419-a9419f74343d?auto=format&fit=crop&w=800&q=80",760,640],
      ["r5","Solitaire ring","https://images.unsplash.com/photo-1603561591411-07134e71a2a9?auto=format&fit=crop&w=800&q=80",2100,1890],
      ["r6","Stud pair","https://images.unsplash.com/photo-1617038260897-41a1f14a8ca0?auto=format&fit=crop&w=800&q=80",260,260],
      ["r7","Oval pendant","https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=800&q=80",540,470],
      ["r8","Chain necklace","https://images.unsplash.com/photo-1599643477877-530eb83abc8e?auto=format&fit=crop&w=800&q=80",380,380]
    ].map(([id,name,img,was,now]) => ({id,name,img,was,now}));
    const key="lumiere-v3";
    const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(key+k))??d}catch{return d}};
    const write=(k,v)=>localStorage.setItem(key+k,JSON.stringify(v));
    let cart=read("c",[]), user=read("u",null), orders=read("o",[]), view="home";
    const gbp=n=>"£"+n.toFixed(2);
    const find=id=>products.find(p=>p.id===id);
    const app=document.getElementById("app");
    const go=v=>{view=v;draw()};
    document.getElementById("cartBtn").onclick=()=>go("cart");
    document.getElementById("loginBtn").onclick=()=>go(user?"account":"login");
    function card(p){return `<article class="card"><img src="${p.img}" alt="${p.name}"><h3>${p.name}</h3><p>${p.was!==p.now?`<span class="was">${gbp(p.was)}</span>`:""}<span class="now">${gbp(p.now)}</span></p><select id="s-${p.id}"><option>Small</option><option selected>Medium</option><option>Large</option></select><button class="buy" data-add="${p.id}">Add to bag</button></article>`}
    function draw(){
      document.getElementById("count").textContent=cart.reduce((s,i)=>s+i.qty,0);
      document.getElementById("loginBtn").textContent=user?user.name:"Account";
      const pages={home,shop,cart:cartView,checkout,orders:ordersView,terms,login,account};
      app.innerHTML=pages[view]();
      document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
      document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
        const size=document.getElementById("s-"+b.dataset.add).value;
        const hit=cart.find(x=>x.id===b.dataset.add&&x.size===size);
        if(hit)hit.qty++; else cart.push({id:b.dataset.add,size,qty:1});
        write("c",cart); draw();
      });
      document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.del,1);write("c",cart);draw()});
      const pay=document.getElementById("pay");
      if(pay)pay.onclick=()=>{orders.unshift({items:cart.map(i=>({name:find(i.id).name,size:i.size})),total:cart.reduce((s,i)=>s+find(i.id).now*i.qty,0)});write("o",orders);cart=[];write("c",cart);go("orders")};
      const enter=document.getElementById("enter");
      if(enter)enter.onclick=()=>{const name=document.getElementById("nm").value.trim(); if(!name)return; user={name}; write("u",user); go("shop")};
      const out=document.getElementById("out");
      if(out)out.onclick=()=>{user=null;write("u",null);go("home")};
    }
    function home(){return `<section class="hero" style="background-image:url('https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=1600&q=80')"><h1>The private collection</h1></section><div class="wrap"><div class="grid">${products.map(card).join("")}</div></div>`}
    function shop(){return `<div class="wrap"><div class="grid">${products.map(card).join("")}</div></div>`}
    function cartView(){if(!cart.length)return `<div class="sheet"><h2>Your bag is empty</h2><button class="buy" data-go="shop">Continue shopping</button></div>`;const total=cart.reduce((s,i)=>s+find(i.id).now*i.qty,0);return `<div class="sheet"><h2>Bag</h2>${cart.map((i,idx)=>`<div class="row"><div>${find(i.id).name}<br>${i.size} × ${i.qty}</div><div>${gbp(find(i.id).now*i.qty)}<br><button data-del="${idx}">Remove</button></div></div>`).join("")}<p><b>${gbp(total)}</b></p><button class="buy" data-go="checkout">Checkout</button></div>`}
    function checkout(){if(!user)return `<div class="sheet"><h2>Sign in to checkout</h2><button class="buy" data-go="login">Account</button></div>`;return `<div class="sheet"><h2>Demo checkout</h2><p>${user.name}</p><input value="4242 4242 4242 4242"><p>No real payment is taken.</p><button class="buy" id="pay">Place order</button></div>`}
    function ordersView(){if(!orders.length)return `<div class="sheet"><h2>No orders yet</h2></div>`;return `<div class="sheet"><h2>Orders</h2>${orders.map(o=>`<div class="row"><span>${o.items.map(i=>i.name).join(", ")}</span><span>${gbp(o.total)}</span></div>`).join("")}</div>`}
    function terms(){return `<div class="sheet"><h2>Terms</h2><p>Prices are sample figures for a design portfolio. Orders stay in this browser only.</p></div>`}
    function login(){return `<div class="sheet"><h2>Account</h2><input id="nm" placeholder="Name"><button class="buy" id="enter">Continue</button></div>`}
    function account(){return `<div class="sheet"><h2>${user.name}</h2><button class="buy" id="out">Sign out</button></div>`}
    document.querySelectorAll("header [data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
    draw();
  </script>
</body>
</html>
